<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420">
<style>
.level { animation: level 16s infinite; transform-box: fill-box; transform-origin: bottom; }
@keyframes level {
  0% { transform: scaleY(.62); animation-timing-function: cubic-bezier(.5,0,.8,.6); }
  34% { transform: scaleY(.91); }
  40% { transform: scaleY(.91); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  50% { transform: scaleY(.68); }
  74% { transform: scaleY(.68); animation-timing-function: ease-in-out; }
  84% { transform: scaleY(.74); }
  96% { transform: scaleY(.74); animation-timing-function: ease-in-out; }
  100% { transform: scaleY(.62); }
}
.hot { animation: hot 16s infinite; }
@keyframes hot {
  0% { opacity: 0; }
  28% { opacity: 0; }
  31% { opacity: 1; }
  44% { opacity: 1; }
  48% { opacity: 0; }
  100% { opacity: 0; }
}
.cool { animation: cool 16s infinite; }
@keyframes cool {
  0% { opacity: 1; }
  35% { opacity: 1; animation-timing-function: ease-in-out; }
  42% { opacity: .32; }
  76% { opacity: .32; animation-timing-function: ease-out; }
  80% { opacity: 1; }
  100% { opacity: 1; }
}
.cool-dot { animation: cool-dot 16s infinite; }
@keyframes cool-dot {
  0% { fill-opacity: 1; }
  37% { fill-opacity: 1; }
  39% { fill-opacity: 0; }
  78% { fill-opacity: 0; }
  80% { fill-opacity: 1; }
  100% { fill-opacity: 1; }
}
.snow { animation: snow 16s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes snow {
  0% { opacity: 0; transform: rotate(-40deg) scale(.5); }
  37% { opacity: 0; transform: rotate(-40deg) scale(.5); animation-timing-function: ease-out; }
  46% { opacity: 1; transform: rotate(0deg) scale(1); }
  74% { opacity: 1; transform: rotate(0deg) scale(1); animation-timing-function: ease-in; }
  79% { opacity: 0; transform: rotate(25deg) scale(.5); }
  100% { opacity: 0; }
}
.drift { animation: drift 16s infinite; }
@keyframes drift {
  0% { transform: translate(0,0); opacity: 0; }
  40% { transform: translate(0,0); opacity: 0; }
  41% { transform: translate(0,0); opacity: .9; animation-timing-function: cubic-bezier(.3,.1,.3,1); }
  54% { transform: translate(var(--dx),-70px); opacity: 0; }
  100% { opacity: 0; }
}
.cur { animation: cur 16s infinite; }
@keyframes cur {
  0% { transform: translate(150px,120px); opacity: 0; }
  58% { transform: translate(150px,120px); opacity: 0; }
  60% { transform: translate(150px,120px); opacity: 1; animation-timing-function: cubic-bezier(.45,.05,.2,1); }
  69% { transform: translate(-4px,3px); opacity: 1; animation-timing-function: cubic-bezier(.3,.6,.4,1); }
  72% { transform: translate(0px,0px); opacity: 1; }
  86% { transform: translate(0px,0px); opacity: 1; }
  90% { transform: translate(0px,0px); opacity: 0; }
  100% { opacity: 0; }
}
.wake { animation: wake 16s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes wake {
  0% { transform: scale(.2); opacity: 0; }
  73% { transform: scale(.2); opacity: 0; }
  73.5% { transform: scale(.25); opacity: .75; animation-timing-function: ease-out; }
  82% { transform: scale(1.6); opacity: 0; }
  76.5% { transform: scale(1.6); opacity: 0; }
  77.0% { transform: scale(.25); opacity: .75; animation-timing-function: ease-out; }
  81.5% { transform: scale(1.6); opacity: 0; }
  100% { transform: scale(1.6); opacity: 0; }
}
.live { animation: live 3.2s ease-in-out infinite; }
@keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
