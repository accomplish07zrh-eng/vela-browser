<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vela Browser 本地服务已停止</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #ffffff;
      --ink: #111114;
      --muted: #6b6d77;
      --line: rgba(0, 0, 0, 0.055);
      --shadow: 0 18px 46px -8px rgba(0, 0, 0, 0.085), 0 4px 12px rgba(0, 0, 0, 0.045);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090c;
        --surface: #16161b;
        --ink: #f2f2f5;
        --muted: #9c9ea8;
        --line: rgba(255, 255, 255, 0.065);
        --shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.72), 0 6px 18px rgba(0, 0, 0, 0.42);
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(460px, 100%);
      padding: 36px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 10px;
      font-family: "Noto Serif SC", "STZhongsong", "华文中宋", "Songti SC", "SimSun", Georgia, serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vela Browser 本地服务已停止</h1>
    <p>请在打开其他浏览器环境前重新启动 Vela Browser。</p>
    <p>未能确认浏览器清理状态，Vela Browser 已保留恢复记录供下次启动时使用。</p>
  </main>
</body>
</html>
