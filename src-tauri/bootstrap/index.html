<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vela Browser service stopped</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --ink: #09090b;
      --muted: #686870;
      --line: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #070708;
        --surface: #101012;
        --ink: #fafafa;
        --muted: #8e8e96;
        --line: #222226;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(460px, 100%);
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 56px -12px rgba(9, 9, 11, 0.14);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vela Browser’s local service stopped</h1>
    <p>Restart Vela Browser before opening another browser.</p>
    <p>Browser cleanup could not be confirmed. Vela Browser kept its recovery record for the next start.</p>
  </main>
</body>
</html>
